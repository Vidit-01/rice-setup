[opener]
edit = [
  { run = 'nvim "$@"', block = true, desc = "Edit in Neovim", for = "unix" },
]

open = [
  { run = 'xdg-open "$@"', desc = "Open with default app", orphan = true, for = "unix" },
]

pdf = [
  { run = 'okular "$@"', desc = "Open PDF in Okular", orphan = true, for = "unix" },
]

image = [
  { run = 'gwenview "$@"', desc = "Open image in Gwenview", orphan = true, for = "unix" },
]

media = [
  { run = 'vlc "$@"', desc = "Open media in VLC", orphan = true, for = "unix" },
]

archive = [
  { run = 'ark "$@"', desc = "Open archive in Ark", orphan = true, for = "unix" },
]

[open]
rules = [
  { mime = "text/*", use = "edit" },
  { mime = "application/pdf", use = "pdf" },
  { mime = "image/*", use = "image" },
  { mime = "audio/*", use = "media" },
  { mime = "video/*", use = "media" },
  { mime = "application/zip", use = "archive" },
  { mime = "application/x-tar", use = "archive" },
  { mime = "application/gzip", use = "archive" },
  { mime = "application/x-7z-compressed", use = "archive" },
  { mime = "application/x-rar", use = "archive" },
  { url = "*", use = "open" },
]
